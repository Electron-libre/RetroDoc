[workspace]
resolver = "2"
members = [
    "crates/retrodoc-cli",
    "crates/retrodoc-core",
    "crates/retrodoc-ingest",
    "crates/retrodoc-llm",
    "crates/retrodoc-pipeline",
    "crates/retrodoc-render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cedricbrancourt/retrodoc"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
globset = "0.4"
git2 = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sha2 = "0.10"
serde_yaml = "0.9"
similar = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

retrodoc-core = { path = "crates/retrodoc-core" }
retrodoc-ingest = { path = "crates/retrodoc-ingest" }
retrodoc-llm = { path = "crates/retrodoc-llm" }
retrodoc-pipeline = { path = "crates/retrodoc-pipeline" }
retrodoc-render = { path = "crates/retrodoc-render" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
