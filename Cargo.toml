[workspace]
resolver = "2"
members = [
    "crates/retrodoc-cli",
    "crates/retrodoc-core",
    "crates/retrodoc-ingest",
    "crates/retrodoc-llm",
    "crates/retrodoc-mcp",
    "crates/retrodoc-pipeline",
    "crates/retrodoc-render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cedricbrancourt/retrodoc"

[workspace.dependencies]
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.26"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-swift = "0.7"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
git2 = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sha2 = "0.10"
serde_yaml = "0.9"
similar = "2"
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

retrodoc-core = { path = "crates/retrodoc-core" }
retrodoc-ingest = { path = "crates/retrodoc-ingest" }
retrodoc-llm = { path = "crates/retrodoc-llm" }
retrodoc-mcp = { path = "crates/retrodoc-mcp" }
retrodoc-pipeline = { path = "crates/retrodoc-pipeline" }
retrodoc-render = { path = "crates/retrodoc-render" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
