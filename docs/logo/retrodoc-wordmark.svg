<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">RetroDoc</title>
  <rect width="720" height="220" rx="32" fill="#17171b"/>
  <g transform="translate(24 20) scale(0.703125) translate(-8 0)">
    <!-- the history, in silver, wound back: the arrow turns counterclockwise -->
    <path d="M128 44 A84 84 0 1 0 212 124" fill="none" stroke="#c0c4c8" stroke-width="18" stroke-linecap="round"/>
    <path d="M212 94 L234 128 H190 Z" fill="#c0c4c8" stroke="#c0c4c8" stroke-width="6" stroke-linejoin="round"/>
    <!-- the doc rewritten from it, in gold, around its core -->
    <path d="M80 128 A48 48 0 1 0 128 80" fill="none" stroke="#d4af37" stroke-width="18" stroke-linecap="round"/>
    <circle cx="128" cy="128" r="15" fill="#e8c872"/>
  </g>
  <text x="232" y="126" font-size="84" font-weight="700" letter-spacing="1"><tspan fill="#c0c4c8">Retro</tspan><tspan fill="#d4af37">Doc</tspan></text>
  <text x="236" y="166" font-size="22" letter-spacing="1" fill="#9b978e">catch up on your documentation debt</text>
</svg>
