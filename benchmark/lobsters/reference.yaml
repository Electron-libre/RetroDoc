repository: https://github.com/lobsters/lobsters
commit: ceb5e71f0d9f5b8ea20b4d96c6c46e1aed27a913
purpose: >-
  Lobsters is a link aggregation community: members submit links or text stories with tags, discuss them in
  threaded comments and vote on both, and the front page ranks stories by votes, comments and age. Membership
  is by invitation, and moderators keep the site on topic in the open, with a public moderation log.
actors:
  - Visitor
  - User
  - New user
  - Moderator
  - Administrator
  - Feed reader
  - Mail client
  - Mastodon
domains:
  - name: Stories
    description: Submitting stories and keeping them in shape.
    features:
      - name: Submit a story
        description: >-
          Post a link or a text with a title and at least one tag, optionally as its author; the title and the
          canonical URL are fetched from the page, tracking parameters are stripped, a preview shows the story
          before posting, a bookmarklet submits the page being read, and earlier submissions of the same URL
          (fuzzy-matched) are pointed out; anyone can look up the discussions of a URL.
        use_cases:
          - Submit a link with tags
          - Submit a text story without a URL
          - Fetch the title of the linked page
          - Preview a story before posting it
          - See the earlier discussions of a URL
          - Submit the current page with the bookmarklet
        evidence:
          - doc: app/views/about/about.html.erb#Tags
          - doc: app/views/about/about.html.erb#Other Technical Features
          - doc: app/views/about/about.html.erb#Guidelines
          - code: app/controllers/stories_controller.rb
          - code: app/models/story.rb
          - code: app/controllers/story_urls_controller.rb
      - name: Edit and delete my story
        description: >-
          The submitter edits a story shortly after posting, deletes or undeletes it, and can disown an old one
          so it no longer shows their name.
        use_cases:
          - Edit my story
          - Delete my story
          - Disown an old story
        evidence:
          - code: app/controllers/stories_controller.rb
          - code: app/models/story.rb
      - name: Suggest a better title or tags
        description: >-
          Members with enough karma suggest another title or other tags for someone else's story; the change is
          applied once enough members suggested the same thing, without a moderator, and is logged.
        use_cases:
          - Suggest new tags for a story
          - Suggest a new title for a story
        evidence:
          - doc: app/views/about/about.html.erb#Other Technical Features
          - url: https://lobste.rs/s/z2dczs/suggesting_story_tag_title_changes
          - code: app/controllers/suggestions_controller.rb
          - code: app/models/suggested_title.rb
          - code: app/models/suggested_tagging.rb
      - name: Hide stories
        description: >-
          Hide a story so that it and its comments no longer show on the home page, the tag pages and in searches,
          and unhide it from the list of hidden stories.
        use_cases:
          - Hide a story
          - Unhide a story from my hidden list
        evidence:
          - doc: app/views/about/about.html.erb#Other Technical Features
          - doc: app/views/about/about.html.erb#Flags
          - code: app/controllers/stories_controller.rb
          - code: app/models/hidden_story.rb
          - code: app/controllers/home_controller.rb
        disputed: 'Current had one feature "Hide and save stories", blind two; split, as hiding filters a story out of every list (own entry in the about page) while saving bookmarks it to read later: opposite intents, separate pages /hidden and /saved.'
      - name: Save stories
        description: Save a story to read it later from my saved list, and unsave it.
        use_cases:
          - Save a story
          - Browse my saved stories
        evidence:
          - code: app/controllers/stories_controller.rb
          - code: app/models/saved_story.rb
          - code: app/controllers/home_controller.rb
        disputed: 'Split out of current "Hide and save stories" as in the blind draft: bookmarking is a capability distinct from hiding.'
  - name: Discussion
    description: Talking about the stories.
    features:
      - name: Read a story and its discussion
        description: >-
          The page of a story shows the link or the text, its tags, the stories merged into it, archive links and
          cached text when the link is unavailable, and the threaded comments, with the comments that are new
          since my last visit marked; short links lead to a story or a comment.
        use_cases:
          - Open the page of a story
          - See the new comments since my last visit
          - Open an archived copy of the link
        evidence:
          - code: app/controllers/stories_controller.rb
          - code: app/views/stories/show.html.erb
          - code: app/models/read_ribbon.rb
          - code: app/models/story_text.rb
        disputed: 'Blind only; added: the story page with unread-comment tracking (read ribbons) is the core reading capability and no current feature covers it.'
      - name: Comment on a story
        description: Write a comment on a story or reply to a comment, in Markdown, in threads, with a preview and mentions of members.
        use_cases:
          - Comment on a story
          - Reply to a comment
        evidence:
          - code: app/controllers/comments_controller.rb
          - code: app/models/comment.rb
      - name: Edit and delete my comment
        description: >-
          The author edits a comment for a while after writing it, deletes it, undeletes it, or disowns an old one.
        use_cases:
          - Edit my comment
          - Delete my comment
          - Disown an old comment
        evidence:
          - code: app/controllers/comments_controller.rb
          - code: app/models/comment.rb
        disputed: 'Merged into "Comment and reply" by the blind draft; kept separate (see Comment on a story).'
      - name: Follow replies and mentions
        description: >-
          Replies to my stories and comments and mentions of my username reach my inbox, and by e-mail or
          Pushover when I asked for it.
        use_cases:
          - Read my unread replies in the inbox
          - Get an e-mail when someone mentions me
