          - code: app/jobs/notify_comment_job.rb
          - code: app/controllers/settings_controller.rb
      - name: Take part by e-mail
        description: >-
          In mailing list mode new stories (with their extracted text) and comments are e-mailed to the member at
          a private list address, who can reply by e-mail to post a comment; at this commit the settings show the
