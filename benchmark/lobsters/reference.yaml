rules:
  - A story title has 3 to 150 characters, may not contain emoji or other graphics, and may not be all in capitals.
  - A story without a URL must have a text.
  - A URL submitted in the last 30 days cannot be submitted again, and a new user cannot resubmit a URL at all.
  - A story needs at least one tag that is not a media tag (PDF, video).
  - Only moderators may use a privileged tag; new users cannot use the tags that are closed to new users.
  - A new user cannot submit a link to a domain that has no story yet.
  - A link from a banned domain or a banned origin cannot be submitted.
  - A member whose karma is below -4 cannot submit stories.
  - An account is a new user for 70 days after it was created.
  - The submitter can edit a story for 6 hours after posting it, unless a moderator has moderated it.
  - A story or a comment can be disowned by its author only once it is older than its deletion period (28 days for a story, 14 days for a comment).
  - A comment can be deleted by its author for 14 days, and edited for 6 hours after its last edit.
  - A story stops accepting comments 90 days after it was posted.
  - Comments cannot be nested deeper than the maximum depth.
  - A reply waits at least 2 minutes after the member's previous comment in the same thread, longer when the thread has flags; moderators are exempt.
  - Only stories younger than 2 days, with a score of at least 2 and not tagged meta, are posted to Mastodon.
  - A comment that only says "me too", "+1" or "nice" is refused, the member is told to upvote instead.
  - A member who flagged a comment cannot reply to it, and a member who replied to a comment cannot flag it.
  - New users cannot flag; flagging a comment needs at least 50 karma.
  - A story can be flagged for 14 days and a comment for 7 days, and not by its author.
  - A member cannot flag a story whose score is already at -5 or less, nor a comment at -10 or less.
  - Upvotes give karma to the author of the story or comment, but not when the voters vote on their own.
  - Suggesting a title or tags needs at least 10 karma and an account that is no longer new.
  - A suggested title replaces the title once 2 members suggested the same one; suggested tags replace the tags once each tag reaches its quorum.
  - A member can send invitations only when no longer a new user, with invitations not disabled and allowed to submit stories.
  - Reading invitation requests needs at least 50 karma, or being a moderator.
  - Without open signups, an account can only be created from an unused invitation.
  - A username can be changed once a year, and a username given up cannot be taken again for 5 years.
  - A private message has a subject of 1 to 100 characters and a body of 5 to 8192 characters.
  - Banning a member needs a reason.
  - Banning a domain or an origin needs a reason.
  - A moderator who edits someone else's story must give a reason.
  - A hat can only be worn by the member who holds it.
  - Members who hid a story are not told about mentions in its comments.
  - Deactivating an account needs the password and the "I am sure" box.
checked:
  date: 2026-11-03
  method: >-
    Evidence cited per feature (the about page at the pinned commit, the maintainers' meta stories it links, the
    code); a blind second draft from these sources, the disagreements settled from the code; `disputed` marks the
    features one draft did not hold, the scope fixes are in the descriptions
    (issues/done/benchmark_references_anchored_in_evidence.md).
