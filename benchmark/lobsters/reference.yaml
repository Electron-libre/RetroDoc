          - Reply to a comment by e-mail
        evidence:
          - doc: app/views/about/about.html.erb#Other Technical Features
          - url: https://lobste.rs/s/jg3eet/lobsters_by_mail
          - code: script/mail_new_activity.rb
          - code: app/mailboxes/inbox_mailbox.rb
          - code: app/views/settings/index.html.erb
      - name: Send private messages
