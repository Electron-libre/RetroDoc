# Pairs checked by hand from the judge's proposals of the first two runs (docs hidden, docs shown).
# `generated` is a name the model produced in a run, `reference` a name of reference.yaml.
# Left out on purpose, judged wrong:
#   Application Documentation (domain) -> Organisation and search  (it is the project's own docs site)
#   RSS/Atom Feed Syndication          -> Share bookmarks          (feeds are not in the reference)
#   System Administration (domain)     -> Accounts and administration (its files are the Django settings modules)
#   Administration & Maintenance, Application Platform (domains) -> Accounts and administration (backups, wiring, migrations)
#   Quality Assurance, Project Operations (domains) -> Organisation and search, Integrations (tests and build scripts)
#   Bookmark Details Modal, Bookmark Browsing, Bundle Management/Preview, Global Site Settings, RSS/Atom Feeds: no reference feature fits
