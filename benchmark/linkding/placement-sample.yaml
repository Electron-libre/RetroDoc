# Hand-labelled sample of 50 entry points of linkding for the placement into features
# (issues/done/closed_answer_decisions_with_semif.md, step 2).
#
# Run: smoke test of linkding at commit 27b7303 (`--domains-from surface`, qwen3.6:35b-a3b); the
# features are those of that run, so the labels hold for it only. The generated features overlap
# (bookmark-management / -2, three snapshot features, two import features), so an entry point has
# every feature it can acceptably go into, not one. `pipeline` is the feature the run held it in.
# Checked against the code: Api.getTags feeds the tag and search autocompletes; GET / redirects to the
# shared or main list by landing page; POST on the archived and shared lists is the search action.
entry_points:
- id: bookmarks/admin.py#GET /admin/tasks/
  acceptable:
  - background-task-administration
  pipeline: background-task-administration
- id: bookmarks/admin.py#POST /admin/bookmarks/bulk_delete/
