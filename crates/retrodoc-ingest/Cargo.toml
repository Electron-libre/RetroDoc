[package]
name = "retrodoc-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["ruby", "rust", "javascript", "typescript", "python"]
ruby = ["dep:tree-sitter-ruby"]
rust = ["dep:tree-sitter-rust"]
javascript = ["dep:tree-sitter-javascript"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]

[dependencies]
tree-sitter.workspace = true
tree-sitter-tags.workspace = true
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
retrodoc-core.workspace = true
ignore.workspace = true
git2.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde_json.workspace = true
toml.workspace = true
serde_yaml.workspace = true
serde.workspace = true
globset.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
