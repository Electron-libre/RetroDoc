[package]
name = "retrodoc-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["ruby", "rust", "javascript", "typescript", "python", "java", "kotlin", "scala", "csharp", "php", "go", "c", "cpp", "swift"]
ruby = ["grammar", "dep:tree-sitter-ruby"]
rust = ["grammar", "dep:tree-sitter-rust"]
javascript = ["grammar", "dep:tree-sitter-javascript"]
typescript = ["grammar", "dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
python = ["grammar", "dep:tree-sitter-python"]
java = ["grammar", "dep:tree-sitter-java"]
kotlin = ["grammar", "dep:tree-sitter-kotlin-ng"]
scala = ["grammar", "dep:tree-sitter-scala"]
csharp = ["grammar", "dep:tree-sitter-c-sharp"]
php = ["grammar", "dep:tree-sitter-php"]
go = ["grammar", "dep:tree-sitter-go"]
c = ["grammar", "dep:tree-sitter-c"]
cpp = ["grammar", "dep:tree-sitter-cpp"]
swift = ["grammar", "dep:tree-sitter-swift"]
# Set by every language: some grammar is compiled in.
grammar = []

[dependencies]
tree-sitter.workspace = true
tree-sitter-tags.workspace = true
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-kotlin-ng = { workspace = true, optional = true }
tree-sitter-scala = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
retrodoc-core.workspace = true
ignore.workspace = true
git2.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde_json.workspace = true
toml.workspace = true
serde_yaml.workspace = true
serde.workspace = true
globset.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
