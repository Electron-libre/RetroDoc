name: Cardinal

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cardinal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cardinal:
    name: agent harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install cardinal (the release of the pinned revision, else built with the runner's cargo)
        run: sh .github/install_cardinal.sh
      - name: Check the specs
        run: |
          if command -v cardinal >/dev/null; then just check-specs; else echo "cardinal not installed: check-specs skipped"; fi
      - name: Check that no synced file was edited
        run: |
          if command -v cardinal >/dev/null; then cardinal check; else echo "cardinal not installed: check-cardinal skipped"; fi

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install cardinal (the release of the pinned revision, else built with the runner's cargo)
        run: sh .github/install_cardinal.sh
      - name: Check every commit of the PR
        run: |
          if command -v cardinal >/dev/null; then
            just check-commits ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          else
            echo "cardinal not installed: check-commits skipped"
          fi
